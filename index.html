<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>颠倒世界：重启序章</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   颠倒世界：重启序章 —— 全局样式
   配色：常态 青蓝#87CEEB / 樱粉#FFB7C5 / 暖金#FFD700
        崩坏态 深蓝#0a1628 / 荧光青#00f0ff / 暗紫#4a0080
   ============================================================ */
:root{
  --c-sky:#87CEEB;
  --c-sakura:#FFB7C5;
  --c-gold:#FFD700;
  --c-deep:#0a1628;
  --c-cyan:#00f0ff;
  --c-purple:#4a0080;
  --c-text:#eaf2ff;
  --glass:rgba(12,22,40,0.55);
  --glass-light:rgba(255,255,255,0.10);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;overflow:hidden;
  font-family:'Noto Sans SC',sans-serif;
  background:#05070f;color:var(--c-text);
  user-select:none;-webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:rgba(0,0,0,0.3);}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--c-cyan),var(--c-purple));border-radius:3px;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
canvas{display:block;}

/* ========== 共用毛玻璃 ========== */
.glass{
  background:var(--glass);
  backdrop-filter:blur(14px) saturate(140%);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
  border:1px solid var(--glass-light);
}

/* ========== 樱花花瓣画布（标题/游戏各一） ========== */
#title-particle-canvas{
  position:absolute;inset:0;width:100%;height:100%;
  z-index:1;pointer-events:none;
}
#game-particle-canvas{
  position:fixed;inset:0;width:100%;height:100%;
  z-index:12;pointer-events:none;
}

/* ============================================================
   开始界面
   ============================================================ */
#title-screen{
  position:fixed;inset:0;z-index:200;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background-image:url('assets/bg_title.jpg');
  background-size:cover;background-position:center;
  transition:opacity 1.2s ease,filter 1.2s ease;
}
#title-screen::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(5,7,15,0.15) 0%,rgba(5,7,15,0.35) 60%,rgba(5,7,15,0.75) 100%);
}
#title-screen.hidden{opacity:0;pointer-events:none;filter:blur(8px);}
.title-glow{
  position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);
  width:780px;height:780px;pointer-events:none;
  background:radial-gradient(ellipse,rgba(255,215,0,0.28) 0%,rgba(255,183,197,0.18) 40%,transparent 72%);
  animation:pulseGlow 5s ease-in-out infinite;
}
@keyframes pulseGlow{0%,100%{opacity:0.55;transform:translate(-50%,-50%) scale(1);}50%{opacity:0.9;transform:translate(-50%,-50%) scale(1.08);}}
.title-content{position:relative;z-index:2;text-align:center;animation:titleFadeIn 2.2s cubic-bezier(.2,.8,.2,1) both;}
@keyframes titleFadeIn{
  0%{opacity:0;filter:blur(16px);transform:translateY(24px);}
  60%{opacity:1;filter:blur(2px);}
  100%{opacity:1;filter:blur(0);transform:translateY(0);}
}
.game-title{
  font-size:clamp(56px,9vw,128px);font-weight:900;letter-spacing:0.12em;
  color:#fff;line-height:1;
  text-shadow:0 0 18px rgba(135,206,235,0.8),0 0 40px rgba(255,183,197,0.6),0 6px 30px rgba(0,0,0,0.7);
  animation:titleGlow 3.5s ease-in-out infinite alternate;
}
@keyframes titleGlow{
  from{text-shadow:0 0 14px rgba(135,206,235,0.7),0 0 34px rgba(255,183,197,0.5),0 6px 30px rgba(0,0,0,0.7);}
  to{text-shadow:0 0 26px rgba(0,240,255,0.9),0 0 60px rgba(74,0,128,0.7),0 6px 30px rgba(0,0,0,0.7);}
}
.title-sub-zh{
  font-size:clamp(24px,3.4vw,44px);font-weight:300;letter-spacing:0.6em;margin-top:14px;
  color:var(--c-gold);text-shadow:0 0 16px rgba(255,215,0,0.7),0 4px 16px rgba(0,0,0,0.6);
  padding-left:0.6em;
}
.title-sub-en{
  font-family:'Cinzel',serif;font-size:clamp(12px,1.4vw,18px);letter-spacing:0.45em;
  color:var(--c-sky);margin-top:18px;opacity:0.85;
  text-shadow:0 0 12px rgba(135,206,235,0.6);
}
.title-divider{
  width:240px;height:1px;margin:30px auto 26px;
  background:linear-gradient(90deg,transparent,var(--c-sakura),var(--c-cyan),transparent);
}
.title-buttons{
  display:flex;flex-direction:column;gap:16px;align-items:center;margin-top:8px;
}
.tbtn{
  position:relative;width:280px;padding:15px 24px;font-size:17px;font-weight:500;letter-spacing:0.35em;
  text-align:center;color:#eaf6ff;padding-left:calc(24px + 0.35em);
  background:rgba(12,22,40,0.42);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.18);border-radius:40px;overflow:hidden;
  transition:all .4s cubic-bezier(.2,.8,.2,1);
}
.tbtn::before{
  content:"";position:absolute;inset:0;border-radius:40px;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(0,240,255,0.35),transparent 60%);
  opacity:0;transition:opacity .4s ease;
}
.tbtn::after{
  content:"";position:absolute;inset:0;border-radius:40px;
  box-shadow:0 0 0 0 rgba(0,240,255,0.5);transition:box-shadow .5s ease;
}
.tbtn:hover{
  transform:translateY(-3px);border-color:rgba(0,240,255,0.6);
  background:rgba(0,40,70,0.5);letter-spacing:0.42em;
}
.tbtn:hover::before{opacity:1;}
.tbtn:hover::after{box-shadow:0 0 24px 4px rgba(0,240,255,0.35),0 0 60px 8px rgba(135,206,235,0.18);}
.tbtn span{position:relative;z-index:1;}
.title-footer{
  position:absolute;bottom:18px;left:0;right:0;text-align:center;z-index:2;
  font-size:12px;letter-spacing:0.2em;color:rgba(234,242,255,0.55);
}
.title-footer b{color:var(--c-cyan);font-weight:400;}

/* ============================================================
   主游戏界面
   ============================================================ */
#game-screen{position:fixed;inset:0;z-index:10;opacity:0;pointer-events:none;transition:opacity .8s ease;}
#game-screen.active{opacity:1;pointer-events:auto;}

/* 顶部导航栏 */
#top-nav{
  position:fixed;top:0;left:0;right:0;height:60px;z-index:30;
  display:flex;align-items:center;justify-content:space-between;padding:0 22px;
  background:linear-gradient(180deg,rgba(8,14,28,0.82),rgba(8,14,28,0.45));
  backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,0.10);
}
.nav-logo{font-size:18px;font-weight:700;letter-spacing:0.25em;color:#fff;}
.nav-logo .dot{color:var(--c-cyan);}
.scene-tabs{display:flex;gap:6px;}
.scene-tab{
  padding:8px 20px;font-size:14px;letter-spacing:0.18em;color:rgba(234,242,255,0.6);
  border-radius:20px;border:1px solid transparent;transition:all .35s ease;
}
.scene-tab:hover{color:#fff;background:rgba(255,255,255,0.06);}
.scene-tab.active{
  color:var(--c-cyan);background:rgba(0,240,255,0.10);
  border-color:rgba(0,240,255,0.4);box-shadow:0 0 14px rgba(0,240,255,0.25);
}
.scene-tab.locked{opacity:0.4;cursor:not-allowed;}
.nav-buttons{display:flex;gap:8px;}
.nav-btn{
  position:relative;width:38px;height:38px;border-radius:10px;font-size:13px;letter-spacing:0.1em;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);
  transition:all .3s ease;
}
.nav-btn:hover{background:rgba(0,240,255,0.12);border-color:rgba(0,240,255,0.4);color:var(--c-cyan);transform:translateY(-2px);}
.nav-btn .badge{
  position:absolute;transform:translate(12px,-12px);min-width:18px;height:18px;padding:0 4px;
  background:var(--c-sakura);color:#3a0a1a;font-size:11px;font-weight:700;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
}

/* 虚实切换按钮 */
#reality-toggle{
  position:fixed;left:22px;top:50%;transform:translateY(-50%);z-index:35;
  width:64px;height:64px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(135,206,235,0.9),rgba(20,60,110,0.85));
  border:2px solid rgba(135,206,235,0.7);
  box-shadow:0 0 20px rgba(135,206,235,0.5),inset 0 0 14px rgba(255,255,255,0.25);
  font-size:13px;font-weight:700;letter-spacing:0.1em;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;
  transition:all .5s ease;
}
#reality-toggle::before{
  content:"";position:absolute;inset:-6px;border-radius:50%;
  border:2px solid rgba(135,206,235,0.5);animation:realityPulse 2.4s ease-out infinite;
}
@keyframes realityPulse{0%{transform:scale(1);opacity:0.7;}100%{transform:scale(1.5);opacity:0;}}
#reality-toggle.corrupted{
  background:radial-gradient(circle at 35% 30%,rgba(0,240,255,0.95),rgba(10,22,40,0.9));
  border-color:var(--c-cyan);box-shadow:0 0 28px rgba(0,240,255,0.7),inset 0 0 14px rgba(255,255,255,0.3);
}
#reality-toggle.corrupted::before{border-color:var(--c-cyan);}
#reality-toggle:hover{transform:translateY(-50%) scale(1.08);}
#reality-toggle.disabled{opacity:0.4;cursor:not-allowed;filter:grayscale(0.6);}

/* 场景容器 */
#scene-container{position:fixed;inset:0;z-index:11;}
.scene{
  position:absolute;inset:0;opacity:0;pointer-events:none;
  transition:opacity .8s ease;
  background-size:cover;background-position:center;background-repeat:no-repeat;
}
.scene.active{opacity:1;pointer-events:auto;}
.scene.fade-out{opacity:0;}
/* 常态遮罩（微暖） */
.scene::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(5,7,15,0.08),rgba(5,7,15,0.32));
  transition:background .6s ease;
}
.scene.corrupted::after{
  background:linear-gradient(180deg,rgba(74,0,128,0.20),rgba(0,20,40,0.55));
}
.scene.corrupted{
  filter:hue-rotate(8deg) contrast(1.12) saturate(0.85);
}

/* 热点（交互物品）层 —— 扩大点击区到120x120，圆点28px，光环80px，标签始终可见 */
.hotspot-layer{position:absolute;inset:0;z-index:25;pointer-events:none;}
.hotspot{
  position:absolute;transform:translate(-50%,-50%);
  width:120px;height:120px;cursor:pointer;pointer-events:auto;
  display:flex;align-items:center;justify-content:center;
}
.hotspot-dot{
  width:28px;height:28px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,215,0,0.98),rgba(255,183,197,0.55));
  box-shadow:0 0 16px rgba(255,215,0,0.9),0 0 32px rgba(255,183,197,0.5),0 0 60px rgba(255,215,0,0.3);
  animation:hotspotPulse 1.8s ease-in-out infinite;z-index:2;
}
.scene.corrupted .hotspot-dot{
  background:radial-gradient(circle,rgba(0,240,255,0.98),rgba(74,0,128,0.6));
  box-shadow:0 0 16px rgba(0,240,255,0.95),0 0 36px rgba(0,240,255,0.55),0 0 64px rgba(0,240,255,0.3);
}
/* 增强脉冲：scale 1→1.5，发光更明显 */
@keyframes hotspotPulse{
  0%,100%{transform:scale(1);opacity:0.92;}
  50%{transform:scale(1.5);opacity:1;}
}
/* 怠速加速态：玩家30秒未交互时，脉冲提速提示 */
.hotspot-layer.urgent .hotspot-dot{animation-duration:0.7s;}
.hotspot-ring{
  position:absolute;inset:0;margin:auto;width:80px;height:80px;border-radius:50%;
  border:1.5px solid rgba(255,215,0,0.55);opacity:0.7;transition:all .35s ease;
  animation:hotspotRingPulse 2.4s ease-in-out infinite;
}
.scene.corrupted .hotspot-ring{border-color:rgba(0,240,255,0.65);}
@keyframes hotspotRingPulse{
  0%,100%{transform:scale(0.9);opacity:0.45;}
  50%{transform:scale(1.18);opacity:0.85;}
}
.hotspot-layer.urgent .hotspot-ring{animation-duration:0.9s;}
.hotspot:hover .hotspot-ring{opacity:1;transform:scale(1.25);}
.hotspot:hover .hotspot-dot{transform:scale(1.35);}
.hotspot-label{
  position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
  white-space:nowrap;font-size:13px;letter-spacing:0.14em;color:#fff;
  background:rgba(8,14,28,0.72);padding:5px 14px;border-radius:14px;
  border:1px solid rgba(255,255,255,0.22);
  opacity:1;transition:all .3s ease;pointer-events:none;  /* 标签始终可见 */
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  text-shadow:0 1px 4px rgba(0,0,0,0.6);
}
.hotspot:hover .hotspot-label{bottom:-10px;background:rgba(0,40,70,0.85);border-color:rgba(0,240,255,0.5);}
.hotspot.solved .hotspot-dot{background:radial-gradient(circle,rgba(120,255,170,0.9),rgba(60,200,120,0.4));box-shadow:0 0 16px rgba(120,255,170,0.8);}
.hotspot.solved .hotspot-ring{border-color:rgba(120,255,170,0.5);opacity:0.5;animation:none;transform:scale(1);}
.hotspot.solved .hotspot-label{opacity:0.55;}

/* 灯笼（神社） */
.lantern{
  position:absolute;transform:translate(-50%,-50%);width:54px;height:78px;cursor:pointer;
  display:flex;align-items:flex-end;justify-content:center;pointer-events:auto;
}
.lantern-body{
  width:46px;height:60px;border-radius:50%/40%;
  background:linear-gradient(180deg,#7a1020,#4a0810);
  border:2px solid #2a0508;transition:all .4s ease;position:relative;
}
.lantern.lit .lantern-body{
  background:radial-gradient(circle at 50% 45%,#fff5d0,#ffb84a 55%,#ff7a2a);
  box-shadow:0 0 26px rgba(255,184,74,0.85),0 0 60px rgba(255,140,60,0.5);
  border-color:#ffce6a;
}
.lantern-cap{position:absolute;top:-8px;width:30px;height:10px;background:#2a0508;border-radius:4px;}
.lantern-string{position:absolute;top:-22px;left:50%;width:2px;height:16px;background:rgba(255,255,255,0.3);}
.lantern:hover .lantern-body{transform:translateY(-2px);}

/* 雨画布 */
#rain-canvas{position:fixed;inset:0;z-index:13;pointer-events:none;opacity:0;transition:opacity .8s ease;}
#rain-canvas.active{opacity:1;}

/* ============================================================
   对话框系统
   ============================================================ */
#dialogue-box{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(120%);
  width:min(960px,92vw);z-index:65;
  display:flex;align-items:stretch;gap:0;
  background:linear-gradient(180deg,rgba(8,14,28,0.5),rgba(5,8,16,0.92));
  backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,0.15);
  border-left:1px solid rgba(255,255,255,0.10);border-right:1px solid rgba(255,255,255,0.10);
  border-radius:18px 18px 0 0;padding:18px 24px 22px;
  transition:transform .5s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 -10px 40px rgba(0,0,0,0.5);
}
#dialogue-box.show{transform:translateX(-50%) translateY(0);}
.dialogue-avatar{
  flex:0 0 auto;width:88px;height:88px;border-radius:50%;
  background-size:cover;background-position:center top;
  border:3px solid var(--c-cyan);align-self:center;
  box-shadow:0 0 18px rgba(0,240,255,0.5);
  animation:avatarFloat 3s ease-in-out infinite;
}
@keyframes avatarFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
.dialogue-content{flex:1;padding-left:20px;display:flex;flex-direction:column;justify-content:center;min-height:88px;}
.dialogue-name{font-size:15px;font-weight:700;letter-spacing:0.2em;color:var(--c-cyan);margin-bottom:6px;text-shadow:0 0 10px rgba(0,240,255,0.4);}
.dialogue-text{font-size:17px;line-height:1.8;color:#eaf6ff;letter-spacing:0.04em;min-height:50px;}
.dialogue-text .cursor{display:inline-block;width:8px;height:18px;background:var(--c-cyan);margin-left:2px;vertical-align:middle;animation:cursorBlink 0.7s steps(1) infinite;}
@keyframes cursorBlink{50%{opacity:0;}}
.dialogue-next{
  position:absolute;right:22px;bottom:14px;font-size:12px;letter-spacing:0.15em;
  color:rgba(234,242,255,0.5);animation:nextBlink 1.4s ease-in-out infinite;
}
@keyframes nextBlink{0%,100%{opacity:0.4;}50%{opacity:1;}}

/* ============================================================
   线索面板（右侧抽屉）
   ============================================================ */
#clue-panel{
  position:fixed;top:60px;right:0;bottom:0;width:340px;z-index:36;
  transform:translateX(100%);transition:transform .5s cubic-bezier(.2,.8,.2,1);
  background:linear-gradient(180deg,rgba(10,18,34,0.88),rgba(6,10,22,0.92));
  backdrop-filter:blur(18px);border-left:1px solid rgba(255,255,255,0.12);
  display:flex;flex-direction:column;padding:20px 18px;
}
#clue-panel.open{transform:translateX(0);}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.panel-title{font-size:16px;font-weight:700;letter-spacing:0.25em;color:#fff;}
.panel-title .accent{color:var(--c-cyan);}
.panel-close{width:30px;height:30px;border-radius:8px;font-size:16px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);}
.panel-close:hover{background:rgba(255,80,80,0.2);color:#fff;}
.panel-subtabs{display:flex;gap:8px;margin-bottom:14px;}
.panel-subtab{padding:6px 14px;font-size:13px;border-radius:14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:rgba(234,242,255,0.6);transition:all .3s ease;}
.panel-subtab.active{color:var(--c-cyan);background:rgba(0,240,255,0.12);border-color:rgba(0,240,255,0.4);}
.panel-body{flex:1;overflow-y:auto;padding-right:4px;}
.clue-card{
  position:relative;padding:14px 14px 14px 18px;margin-bottom:12px;border-radius:12px;
  background:linear-gradient(135deg,rgba(0,240,255,0.06),rgba(74,0,128,0.10));
  border:1px solid rgba(0,240,255,0.18);
  animation:clueAppear .6s cubic-bezier(.2,.8,.2,1) both;
}
.clue-card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:2px;background:linear-gradient(var(--c-cyan),var(--c-purple));}
@keyframes clueAppear{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}
.clue-card h4{font-size:14px;font-weight:700;letter-spacing:0.1em;color:var(--c-cyan);margin-bottom:6px;}
.clue-card p{font-size:13px;line-height:1.7;color:rgba(234,242,255,0.82);}
.empty-hint{text-align:center;color:rgba(234,242,255,0.4);font-size:13px;padding:40px 10px;line-height:1.8;}

/* 碎片图鉴 */
.fragment-card{
  position:relative;display:flex;gap:12px;align-items:center;padding:12px;margin-bottom:12px;border-radius:12px;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.10);
}
.fragment-card.collected{background:linear-gradient(135deg,rgba(255,183,197,0.10),rgba(255,215,0,0.10));border-color:rgba(255,183,197,0.4);}
.fragment-icon{
  flex:0 0 auto;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,rgba(120,120,140,0.4),rgba(40,40,60,0.5));border:1px solid rgba(255,255,255,0.15);
  font-size:18px;color:rgba(234,242,255,0.4);
}
.fragment-card.collected .fragment-icon{
  background:radial-gradient(circle,rgba(255,215,0,0.5),rgba(255,140,60,0.3));
  border-color:var(--c-gold);color:#fff;
  animation:fragmentSpin 4s linear infinite;
}
@keyframes fragmentSpin{from{box-shadow:0 0 14px rgba(255,215,0,0.5),0 0 0 0 rgba(255,215,0,0.3);}50%{box-shadow:0 0 24px rgba(255,215,0,0.8),0 0 0 6px rgba(255,215,0,0);}to{box-shadow:0 0 14px rgba(255,215,0,0.5),0 0 0 0 rgba(255,215,0,0);}}
.fragment-info h4{font-size:13px;font-weight:700;letter-spacing:0.08em;color:#fff;margin-bottom:3px;}
.fragment-info p{font-size:12px;line-height:1.5;color:rgba(234,242,255,0.6);}
.fragment-card.collected .fragment-info p{color:rgba(234,242,255,0.85);}

/* ============================================================
   提示系统
   ============================================================ */
#hint-system{
  position:fixed;right:22px;bottom:22px;z-index:36;
  display:flex;flex-direction:column;align-items:flex-end;gap:10px;
}
#hint-box{
  width:300px;padding:16px;border-radius:14px;max-height:240px;overflow-y:auto;
  background:linear-gradient(135deg,rgba(10,18,34,0.9),rgba(20,10,40,0.85));
  backdrop-filter:blur(14px);border:1px solid rgba(255,215,0,0.3);
  box-shadow:0 8px 30px rgba(0,0,0,0.4);
  opacity:0;transform:translateY(10px) scale(0.96);pointer-events:none;transition:all .35s ease;
}
#hint-box.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
.hint-level{font-size:12px;letter-spacing:0.2em;color:var(--c-gold);margin-bottom:8px;}
.hint-level .lv{display:inline-block;padding:1px 8px;border-radius:8px;background:rgba(255,215,0,0.15);border:1px solid rgba(255,215,0,0.4);margin-right:6px;}
.hint-text{font-size:13.5px;line-height:1.75;color:rgba(234,242,255,0.9);}
.hint-btn{
  width:52px;height:52px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,215,0,0.9),rgba(120,80,0,0.85));
  border:2px solid rgba(255,215,0,0.6);font-size:13px;font-weight:700;letter-spacing:0.05em;color:#2a1a00;
  box-shadow:0 0 18px rgba(255,215,0,0.4);transition:all .3s ease;
}
.hint-btn:hover{transform:scale(1.1) rotate(8deg);}

/* ============================================================
   弹窗通用
   ============================================================ */
.modal-mask{
  position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  background:rgba(3,5,12,0.7);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .35s ease;
}
.modal-mask.show{opacity:1;pointer-events:auto;}
.modal{
  position:relative;width:min(680px,92vw);max-height:86vh;overflow-y:auto;
  background:linear-gradient(160deg,rgba(12,20,38,0.95),rgba(8,12,26,0.97));
  backdrop-filter:blur(18px);border:1px solid rgba(0,240,255,0.25);
  border-radius:20px;padding:30px 32px;box-shadow:0 20px 60px rgba(0,0,0,0.6),0 0 40px rgba(0,240,255,0.1);
  transform:translateY(20px) scale(0.97);transition:transform .4s cubic-bezier(.2,.8,.2,1);
}
.modal-mask.show .modal{transform:translateY(0) scale(1);}
.modal::before{
  content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;
  background:linear-gradient(135deg,rgba(0,240,255,0.06),transparent 40%,rgba(74,0,128,0.10));
}
.modal-close{
  position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:10px;font-size:18px;
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);color:rgba(234,242,255,0.8);
}
.modal-close:hover{background:rgba(255,80,80,0.25);color:#fff;transform:rotate(90deg);}
.modal-title{font-size:24px;font-weight:700;letter-spacing:0.18em;color:#fff;margin-bottom:6px;text-shadow:0 0 14px rgba(0,240,255,0.4);}
.modal-subtitle{font-size:13px;letter-spacing:0.3em;color:var(--c-cyan);margin-bottom:22px;font-family:'Cinzel',serif;}
.modal-divider{height:1px;background:linear-gradient(90deg,var(--c-cyan),transparent);margin:18px 0;}

/* 世界观/操作 内容块 */
.lore-section{margin-bottom:22px;}
.lore-section h3{
  font-size:16px;font-weight:700;letter-spacing:0.15em;color:var(--c-gold);margin-bottom:10px;
  padding-left:14px;border-left:3px solid var(--c-gold);
}
.lore-section p{font-size:14px;line-height:1.9;color:rgba(234,242,255,0.85);margin-bottom:8px;text-indent:2em;}
.lore-card{
  padding:14px 16px;margin-bottom:10px;border-radius:12px;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.10);
}
.lore-card h4{font-size:14px;font-weight:700;letter-spacing:0.1em;color:var(--c-sky);margin-bottom:5px;}
.lore-card p{font-size:13px;line-height:1.75;color:rgba(234,242,255,0.78);text-indent:0;}
.char-card{display:flex;gap:14px;align-items:center;margin-bottom:12px;}
.char-avatar{flex:0 0 auto;width:64px;height:80px;border-radius:10px;background-size:cover;background-position:center top;border:1px solid rgba(255,255,255,0.2);}
.char-desc h4{font-size:14px;font-weight:700;color:var(--c-sakura);margin-bottom:4px;}
.char-desc p{font-size:12.5px;line-height:1.7;color:rgba(234,242,255,0.8);text-indent:0;}
.mech-list{list-style:none;}
.mech-list li{font-size:13.5px;line-height:1.8;color:rgba(234,242,255,0.85);margin-bottom:8px;padding-left:20px;position:relative;}
.mech-list li::before{content:"";position:absolute;left:0;top:11px;width:8px;height:8px;border-radius:50%;background:var(--c-cyan);box-shadow:0 0 8px var(--c-cyan);}

/* 物品详情弹窗 */
#item-modal .modal{width:min(560px,92vw);}
.item-visual{
  width:100%;height:160px;border-radius:14px;margin-bottom:18px;
  background:linear-gradient(135deg,rgba(0,240,255,0.10),rgba(74,0,128,0.18));
  border:1px solid rgba(0,240,255,0.25);display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.item-visual .item-glyph{font-size:54px;font-weight:900;color:rgba(0,240,255,0.8);text-shadow:0 0 20px rgba(0,240,255,0.6);letter-spacing:0.1em;}
.item-visual .item-glyph.mirror{transform:scaleX(-1);}
.item-text{font-size:15px;line-height:2;color:rgba(234,242,255,0.92);text-indent:2em;}
.item-meta{margin-top:14px;font-size:12px;letter-spacing:0.15em;color:var(--c-cyan);}

/* 密码输入弹窗 */
#code-modal .modal{width:min(420px,92vw);text-align:center;}
.code-display{
  display:flex;gap:14px;justify-content:center;margin:24px 0;
}
.code-digit{
  width:62px;height:78px;border-radius:14px;font-size:40px;font-weight:700;
  display:flex;align-items:center;justify-content:center;color:var(--c-cyan);
  background:rgba(0,20,40,0.6);border:2px solid rgba(0,240,255,0.35);
  box-shadow:inset 0 0 18px rgba(0,240,255,0.15),0 0 16px rgba(0,240,255,0.12);
  text-shadow:0 0 16px rgba(0,240,255,0.8);transition:all .2s ease;
}
.code-digit.filled{border-color:var(--c-cyan);box-shadow:inset 0 0 22px rgba(0,240,255,0.3),0 0 22px rgba(0,240,255,0.3);}
.code-digit.error{border-color:#ff4d6d;color:#ff4d6d;animation:shakeX .4s ease;}
@keyframes shakeX{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
.code-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px;}
.code-key{
  height:54px;border-radius:12px;font-size:22px;font-weight:500;color:#eaf6ff;
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);transition:all .2s ease;
}
.code-key:hover{background:rgba(0,240,255,0.18);border-color:rgba(0,240,255,0.5);color:var(--c-cyan);}
.code-key:active{transform:scale(0.94);}
.code-key.del{color:#ff8da1;}
.code-hint{font-size:13px;color:rgba(234,242,255,0.6);margin-top:14px;min-height:18px;}

/* ============================================================
   结局画面
   ============================================================ */
#ending-screen{
  position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background-image:url('assets/bg_title.jpg');background-size:cover;background-position:center;
  opacity:0;pointer-events:none;transition:opacity 1.6s ease;
  overflow-y:auto;padding:40px 24px;
}
#ending-screen::before{content:"";position:absolute;inset:0;background:rgba(3,5,12,0.78);}
#ending-screen.show{opacity:1;pointer-events:auto;}
.ending-content{position:relative;z-index:2;text-align:center;max-width:760px;padding:0 24px;}
.ending-tag{font-family:'Cinzel',serif;font-size:14px;letter-spacing:0.5em;color:var(--c-cyan);margin-bottom:18px;}
.ending-title{font-size:clamp(36px,6vw,64px);font-weight:900;letter-spacing:0.15em;color:#fff;text-shadow:0 0 24px rgba(0,240,255,0.6);margin-bottom:30px;}
.ending-text{font-size:17px;line-height:2.2;color:rgba(234,242,255,0.92);text-align:left;text-indent:2em;margin-bottom:34px;}
.ending-text p{margin-bottom:10px;}
.ending-cta{font-size:16px;letter-spacing:0.3em;color:var(--c-gold);text-shadow:0 0 14px rgba(255,215,0,0.5);animation:endingCta 2.4s ease-in-out infinite;}
@keyframes endingCta{0%,100%{opacity:0.6;}50%{opacity:1;}}
.ending-btns{margin-top:30px;display:flex;gap:16px;justify-content:center;}

/* ============================================================
   通知 / 粒子特效层
   ============================================================ */
#toast-container{position:fixed;top:78px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:10px;align-items:center;}
.toast{
  padding:12px 26px;border-radius:24px;font-size:14px;letter-spacing:0.12em;color:#fff;
  background:linear-gradient(135deg,rgba(0,240,255,0.25),rgba(74,0,128,0.35));
  backdrop-filter:blur(12px);border:1px solid rgba(0,240,255,0.4);
  box-shadow:0 6px 24px rgba(0,0,0,0.4);animation:toastIn .4s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes toastIn{from{opacity:0;transform:translateY(-16px);}to{opacity:1;transform:translateY(0);}}
.toast.out{animation:toastOut .4s ease forwards;}
@keyframes toastOut{to{opacity:0;transform:translateY(-16px);}}
#fx-canvas{position:fixed;inset:0;z-index:55;pointer-events:none;}

/* 世界异常效果 */
.glitch-overlay{position:fixed;inset:0;z-index:70;pointer-events:none;opacity:0;}
.glitch-overlay.active{opacity:1;animation:glitchFlicker 0.18s steps(2) infinite;}
@keyframes glitchFlicker{0%{background:linear-gradient(90deg,rgba(0,240,255,0.06),transparent,rgba(255,0,128,0.06));}50%{background:linear-gradient(0deg,rgba(74,0,128,0.12),transparent,rgba(0,240,255,0.08));}100%{background:linear-gradient(45deg,rgba(255,0,128,0.05),transparent,rgba(0,240,255,0.10));}}
.glitch-lines{position:fixed;inset:0;z-index:71;pointer-events:none;opacity:0;background:repeating-linear-gradient(0deg,rgba(0,240,255,0.05) 0px,rgba(0,240,255,0.05) 1px,transparent 2px,transparent 4px);}
.glitch-lines.active{opacity:1;animation:glitchShift 0.12s steps(3) infinite;}
@keyframes glitchShift{0%{transform:translateY(0);}33%{transform:translateY(-3px) translateX(2px);}66%{transform:translateY(2px) translateX(-3px);}100%{transform:translateY(0);}}
.shake{animation:worldShake 0.5s ease;}
@keyframes worldShake{0%,100%{transform:translate(0,0);}10%{transform:translate(-4px,2px);}20%{transform:translate(5px,-3px);}30%{transform:translate(-3px,4px);}40%{transform:translate(4px,2px);}50%{transform:translate(-5px,-2px);}60%{transform:translate(3px,3px);}70%{transform:translate(-2px,-4px);}80%{transform:translate(4px,1px);}90%{transform:translate(-3px,2px);}}

/* 飞向图鉴的收集粒子 */
.collect-particle{position:fixed;z-index:56;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,#fff,var(--c-gold));box-shadow:0 0 12px var(--c-gold);pointer-events:none;}

/* 场景转场黑幕 */
#transition-veil{position:fixed;inset:0;z-index:50;background:#05070f;opacity:0;pointer-events:none;transition:opacity .4s ease;}
#transition-veil.show{opacity:1;}

/* 存档提示 */
.save-tag{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:60;font-size:13px;color:var(--c-cyan);background:rgba(8,14,28,0.8);padding:8px 18px;border-radius:16px;border:1px solid rgba(0,240,255,0.3);opacity:0;transition:opacity .4s ease;}
.save-tag.show{opacity:1;}

/* ============================================================
   可交互浮动提示（进入场景时引导，3秒淡出）
   ============================================================ */
#interact-prompt{
  position:fixed;left:50%;top:62%;transform:translate(-50%,0);z-index:42;
  padding:10px 26px;border-radius:24px;font-size:15px;letter-spacing:0.18em;color:#fff;
  background:rgba(8,14,28,0.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,215,0,0.45);box-shadow:0 0 24px rgba(255,215,0,0.3);
  opacity:0;pointer-events:none;transition:opacity .6s ease;
}
#interact-prompt.show{opacity:1;}
#interact-prompt .ip-icon{display:inline-block;margin-right:8px;color:var(--c-gold);animation:ipBlink 1.2s ease-in-out infinite;}
@keyframes ipBlink{0%,100%{opacity:0.5;}50%{opacity:1;}}

/* ============================================================
   场景内环境文字（左下角场景描述，半透明不遮挡）
   ============================================================ */
.scene-ambience{
  position:fixed;left:24px;bottom:24px;z-index:24;max-width:380px;
  padding:14px 18px;border-radius:14px;
  background:rgba(5,8,16,0.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.08);
  font-size:13.5px;line-height:1.85;color:rgba(234,242,255,0.7);
  letter-spacing:0.04em;text-shadow:0 1px 4px rgba(0,0,0,0.6);
  pointer-events:none;opacity:0;transition:opacity .8s ease;font-style:italic;
}
.scene-ambience.show{opacity:1;}
.scene-ambience.dim{opacity:0.12;} /* 对话进行时降低环境文字存在感 */
.scene-ambience .amb-accent{color:rgba(0,240,255,0.75);font-style:normal;}

/* ============================================================
   场景名称大字幕（切换时淡入淡出）
   ============================================================ */
#scene-name-title{
  position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);z-index:40;
  text-align:center;pointer-events:none;opacity:0;
}
#scene-name-title.show{animation:sceneNameShow 2.6s ease forwards;}
@keyframes sceneNameShow{
  0%{opacity:0;transform:translate(-50%,-50%) scale(1.1);filter:blur(8px);}
  18%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(0);}
  78%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(0);}
  100%{opacity:0;transform:translate(-50%,-50%) scale(0.96);filter:blur(4px);}
}
.scene-name-zh{font-size:clamp(34px,5vw,56px);font-weight:900;letter-spacing:0.3em;color:#fff;
  text-shadow:0 0 24px rgba(0,240,255,0.7),0 0 48px rgba(74,0,128,0.5),0 4px 20px rgba(0,0,0,0.7);padding-left:0.3em;}
.scene-name-en{font-family:'Cinzel',serif;font-size:14px;letter-spacing:0.45em;color:var(--c-cyan);margin-top:10px;opacity:0.85;}
.scene-name-line{width:200px;height:1px;margin:16px auto 0;background:linear-gradient(90deg,transparent,var(--c-cyan),transparent);}

/* 对话框角色名字颜色区分：直实蓝、瑠璃粉、成年直实绿、狐面行者灰 */
.dialogue-name.name-nao{color:#6FB7FF;text-shadow:0 0 10px rgba(111,183,255,0.5);}
.dialogue-name.name-ruri{color:#FF8FB3;text-shadow:0 0 10px rgba(255,143,179,0.5);}
.dialogue-name.name-adult{color:#5BE6A0;text-shadow:0 0 10px rgba(91,230,160,0.5);}
.dialogue-name.name-fox{color:#B8B8C8;text-shadow:0 0 10px rgba(184,184,200,0.5);}

/* 密码键盘按压反馈动画 */
.code-key{position:relative;overflow:hidden;}
.code-key::after{content:"";position:absolute;inset:0;border-radius:12px;
  background:radial-gradient(circle at center,rgba(0,240,255,0.45),transparent 70%);
  opacity:0;transform:scale(0.5);}
.code-key.pressed::after{opacity:1;transform:scale(1.6);transition:transform .4s ease,opacity .4s ease;}
.code-key.pressed{transform:scale(0.9);}

/* 碎片卡片入场动画（与线索卡片一致） */
.fragment-card{animation:clueAppear .6s cubic-bezier(.2,.8,.2,1) both;}

/* ============================================================
   结局制作名单滚动 + 完整版预告
   ============================================================ */
.ending-credits{
  margin:24px auto 0;max-width:560px;height:180px;overflow:hidden;position:relative;
  border-top:1px solid rgba(0,240,255,0.2);border-bottom:1px solid rgba(0,240,255,0.2);
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 18%,#000 82%,transparent);
  mask-image:linear-gradient(180deg,transparent,#000 18%,#000 82%,transparent);
}
.ending-credits-inner{animation:creditsScroll 20s linear infinite;text-align:center;padding:10px 0;}
@keyframes creditsScroll{0%{transform:translateY(100%);}100%{transform:translateY(-100%);}}
.credits-line{font-size:13px;letter-spacing:0.18em;color:rgba(234,242,255,0.72);margin:6px 0;}
.credits-role{font-size:11px;letter-spacing:0.3em;color:var(--c-cyan);margin-bottom:2px;}
.credits-sep{height:1px;width:120px;margin:14px auto;background:linear-gradient(90deg,transparent,rgba(0,240,255,0.4),transparent);}
.ending-preview{
  margin-top:22px;padding:14px 20px;border-radius:12px;
  background:linear-gradient(135deg,rgba(74,0,128,0.25),rgba(0,240,255,0.10));
  border:1px solid rgba(0,240,255,0.3);
}
.ending-preview .ep-tag{font-family:'Cinzel',serif;font-size:12px;letter-spacing:0.4em;color:var(--c-gold);margin-bottom:6px;}
.ending-preview .ep-text{font-size:14px;line-height:1.8;color:rgba(234,242,255,0.9);font-style:italic;}

@media (max-width:760px){
  #clue-panel{width:88vw;}
  .game-title{font-size:54px;}
  #reality-toggle{left:12px;width:54px;height:54px;}
  .nav-logo{display:none;}
  .scene-ambience{max-width:78vw;font-size:12px;}
}
</style>
</head>
<body>

<!-- 全局星光特效画布 -->
<canvas id="fx-canvas"></canvas>

<!-- ==================== 开始界面 ==================== -->
<div id="title-screen">
  <div class="title-glow"></div>
  <canvas id="title-particle-canvas" class="petal-canvas"></canvas>
  <div class="title-content">
    <h1 class="game-title">颠倒世界</h1>
    <div class="title-sub-zh">重启序章</div>
    <div class="title-sub-en">THE REVERSED WORLD &mdash; PROLOGUE</div>
    <div class="title-divider"></div>
    <div class="title-buttons">
      <button class="tbtn" id="btn-start"><span>开始游戏</span></button>
      <button class="tbtn" id="btn-continue"><span>继续游戏</span></button>
      <button class="tbtn" id="btn-lore"><span>世界观设定</span></button>
      <button class="tbtn" id="btn-controls"><span>操作指南</span></button>
    </div>
  </div>
  <div class="title-footer">© 2026 REVERSED WORLD STUDIO &nbsp;|&nbsp; <b>VER 1.0</b> &nbsp;|&nbsp; 一场关于记忆与重逢的夏日</div>
</div>

<!-- ==================== 主游戏界面 ==================== -->
<div id="game-screen">
  <!-- 顶部导航 -->
  <div id="top-nav">
    <div class="nav-logo">颠倒世界<span class="dot">·</span>序章</div>
    <div class="scene-tabs">
      <button class="scene-tab active" data-scene="classroom">教室</button>
      <button class="scene-tab locked" data-scene="shrine">鸟居</button>
      <button class="scene-tab locked" data-scene="river">河畔</button>
    </div>
    <div class="nav-buttons">
      <button class="nav-btn" id="nav-clue" title="线索面板">线索</button>
      <button class="nav-btn" id="nav-frag" title="记忆碎片">碎片<span class="badge" id="frag-badge" style="display:none">0</span></button>
      <button class="nav-btn" id="nav-save" title="存档">存档</button>
      <button class="nav-btn" id="nav-menu" title="返回标题">返回</button>
    </div>
  </div>

  <!-- 虚实切换 -->
  <button id="reality-toggle" class="disabled" title="切换虚实（崩坏态）">
    <span>虚</span><span>实</span>
  </button>

  <!-- 场景容器（由JS动态生成热点） -->
  <div id="scene-container">
    <div class="scene active" id="scene-classroom"></div>
    <div class="scene" id="scene-shrine"></div>
    <div class="scene" id="scene-river"></div>
  </div>

  <!-- 雨画布 -->

<script>
/* ============================================================
   颠倒世界：重启序章 —— 主程序
   ============================================================ */
"use strict";

/* ============================================================
   一、音频系统（Web Audio API）
   ============================================================ */
const AudioSys = (() => {
  let ctx = null;
  function ensure(){ if(!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return ctx; }
  // 点击音效：短促正弦波
  function click(){
    const c = ensure(); if(!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type='sine'; o.frequency.setValueAtTime(880,c.currentTime);
    o.frequency.exponentialRampToValueAtTime(440,c.currentTime+0.12);
    g.gain.setValueAtTime(0.18,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.14);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime+0.15);
  }
  // 发现线索：C-E-G 三连音
  function clue(){
    const c = ensure(); if(!c) return;
    [523.25,659.25,783.99].forEach((f,i)=>{
      const o=c.createOscillator(),g=c.createGain();
      o.type='sine'; o.frequency.value=f;
      const t=c.currentTime+i*0.12;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.2,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t+0.55);
    });
  }
  // 场景切换：渐弱滑音
  function transition(){
    const c = ensure(); if(!c) return;
    const o=c.createOscillator(),g=c.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(660,c.currentTime);
    o.frequency.exponentialRampToValueAtTime(110,c.currentTime+0.7);
    g.gain.setValueAtTime(0.16,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.8);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime+0.85);
  }
  // 异常音效：锯齿波随机频率
  function glitch(){
    const c = ensure(); if(!c) return;
    for(let i=0;i<6;i++){
      const o=c.createOscillator(),g=c.createGain();
      o.type='sawtooth';
      o.frequency.value=120+Math.random()*1400;
      const t=c.currentTime+i*0.07;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.12,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.09);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t+0.1);
    }
  }
  // 收集碎片音效：上行清脆音
  function collect(){
    const c = ensure(); if(!c) return;
    [783.99,987.77,1318.51].forEach((f,i)=>{
      const o=c.createOscillator(),g=c.createGain();
      o.type='sine'; o.frequency.value=f;
      const t=c.currentTime+i*0.08;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.18,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.4);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t+0.45);
    });
  }
  return { click, clue, transition, glitch, collect, ensure };
})();

/* ============================================================
   二、粒子系统（樱花花瓣 / 光点 / 星光 / 收集飞粒子）
   标题与游戏各用一个花瓣画布，按模式切换绘制目标。
   ============================================================ */
const ParticleSys = (() => {
  const titleCanvas = document.getElementById('title-particle-canvas');
  const gameCanvas = document.getElementById('game-particle-canvas');
  const fxCanvas = document.getElementById('fx-canvas');
  const tCtx = titleCanvas.getContext('2d');
  const gCtx = gameCanvas.getContext('2d');
  const fxCtx = fxCanvas.getContext('2d');
  let petals = [], stars = [], mode = 'title';
  let W=0,H=0;
  let ctx = tCtx; // 当前花瓣绘制上下文

  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    titleCanvas.width = gameCanvas.width = fxCanvas.width = W;
    titleCanvas.height = gameCanvas.height = fxCanvas.height = H;
  }
  window.addEventListener('resize', resize); resize();

  // 樱花花瓣
  function makePetal(){
    return {
      x: Math.random()*W,
      y: -20 - Math.random()*H*0.5,
      size: 6+Math.random()*10,
      speedY: 0.4+Math.random()*1.1,
      speedX: -0.6+Math.random()*1.2,
      sway: Math.random()*Math.PI*2,
      swaySpeed: 0.01+Math.random()*0.02,
      rot: Math.random()*Math.PI*2,
      rotSpeed: -0.03+Math.random()*0.06,
      alpha: 0.5+Math.random()*0.5,
      hue: 340+Math.random()*20 // 樱粉
    };
  }
  function initPetals(n){
    petals = [];
    for(let i=0;i<n;i++){ petals.push(makePetal()); petals[i].y = Math.random()*H; }
  }
  function drawPetal(p){
    ctx.save();
    ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.globalAlpha = p.alpha;
    const grd = ctx.createRadialGradient(0,0,0,0,0,p.size);
    grd.addColorStop(0,`hsla(${p.hue},90%,85%,1)`);
    grd.addColorStop(1,`hsla(${p.hue},80%,70%,0.2)`);
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.ellipse(0,0,p.size*0.7,p.size*1.3,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  // 星光粒子（发现线索时）
  function burstStars(x,y,color){
    for(let i=0;i<26;i++){
      const a = Math.random()*Math.PI*2, s = 1+Math.random()*4;
      stars.push({
        x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
        life:1, size:1+Math.random()*3,
        color: color||'#FFD700'
      });
    }
  }
  // 收集粒子飞向图鉴按钮
  function collectFly(fromX,fromY){
    const target = document.getElementById('nav-frag').getBoundingClientRect();
    const tx = target.left+target.width/2, ty = target.top+target.height/2;
    const el = document.createElement('div');
    el.className='collect-particle';
    el.style.left=fromX+'px'; el.style.top=fromY+'px';
    document.body.appendChild(el);
    const dx=tx-fromX, dy=ty-fromY;
    el.animate([
      {transform:'translate(0,0) scale(1)',opacity:1},
      {transform:`translate(${dx}px,${dy}px) scale(0.2)`,opacity:0}
    ],{duration:800,easing:'cubic-bezier(.5,0,.5,1)'});
    setTimeout(()=>el.remove(),820);
  }

  function loop(){
    // 清空当前花瓣画布
    ctx.clearRect(0,0,W,H);
    if(mode==='title' || mode==='game'){
      petals.forEach(p=>{
        p.sway += p.swaySpeed;
        p.x += p.speedX + Math.sin(p.sway)*0.6;
        p.y += p.speedY;
        p.rot += p.rotSpeed;
        if(p.y > H+20){ Object.assign(p, makePetal()); p.y=-20; }
        if(p.x < -20) p.x = W+20; if(p.x > W+20) p.x = -20;
        drawPetal(p);
      });
    }
    // 星光
    fxCtx.clearRect(0,0,W,H);
    stars = stars.filter(s=>s.life>0);
    stars.forEach(s=>{
      s.x+=s.vx; s.y+=s.vy; s.vy+=0.05; s.life-=0.02;
      fxCtx.globalAlpha = Math.max(0,s.life);
      fxCtx.fillStyle = s.color;
      fxCtx.shadowBlur = 12; fxCtx.shadowColor = s.color;
      fxCtx.beginPath(); fxCtx.arc(s.x,s.y,s.size,0,Math.PI*2); fxCtx.fill();
    });
    fxCtx.globalAlpha = 1; fxCtx.shadowBlur = 0;
    requestAnimationFrame(loop);
  }
  loop();

  return {
    setMode(m){
      mode = m; initPetals(m==='title'?60:22);
      ctx = (m==='title') ? tCtx : gCtx;
      // 切换时清空另一画布，避免残留
      if(m==='title'){ gCtx.clearRect(0,0,W,H); } else { tCtx.clearRect(0,0,W,H); }
    },
    burstStars, collectFly,
    resize
  };
})();

function closeModal(id){ $(id).classList.remove('show'); }
// 通用关闭
document.addEventListener('click',e=>{
  if(e.target.hasAttribute('data-close')){
    const m=e.target.closest('.modal-mask'); if(m) m.classList.remove('show');
  }
  if(e.target.classList.contains('modal-mask')){ e.target.classList.remove('show'); }
});

// 密码输入弹窗
let codeState = { digits:3, input:[], cb:null, errCb:null };
function showCode(title, digitCount, hint, callback, errCb){
  codeState = { digits:digitCount, input:[], cb:callback, errCb:errCb||null };
  $('code-title').textContent=title||'输入密码';
  $('code-hint').textContent=hint||'';
  // 渲染显示框
  const disp=$('code-display'); disp.innerHTML='';
  for(let i=0;i<digitCount;i++){
    const d=document.createElement('div'); d.className='code-digit'; d.dataset.i=i; disp.appendChild(d);
  }
  // 渲染键盘 1-9,0,清空,删除
  const pad=$('code-pad'); pad.innerHTML='';
  ['1','2','3','4','5','6','7','8','9','清','0','⌫'].forEach(k=>{
    const b=document.createElement('button'); b.className='code-key'; b.textContent=k;
    if(k==='清') b.classList.add('del');
    b.addEventListener('click',()=>{
      AudioSys.click();
      // 按压反馈动画
      b.classList.add('pressed');
      setTimeout(()=>b.classList.remove('pressed'),400);
      pressCode(k);
    });
    pad.appendChild(b);
  });
  updateCodeDisplay();
  openModal('code-modal');
}
function pressCode(k){
  if(k==='⌫'){ codeState.input.pop(); }
  else if(k==='清'){ codeState.input=[]; }
  else if(codeState.input.length<codeState.digits){ codeState.input.push(k); }
  updateCodeDisplay();
  if(codeState.input.length===codeState.digits){
    const val = codeState.input.join('');
    setTimeout(()=>{
      if(codeState.cb && codeState.cb(val)){
        // 正确
        document.querySelectorAll('.code-digit').forEach(d=>d.classList.add('filled'));
        AudioSys.clue();
        setTimeout(()=>closeModal('code-modal'),700);
      } else {
        // 错误
        document.querySelectorAll('.code-digit').forEach(d=>{d.classList.add('error');});
        AudioSys.glitch();
        if(codeState.errCb) codeState.errCb();
        setTimeout(()=>{
          codeState.input=[];
          updateCodeDisplay();
          document.querySelectorAll('.code-digit').forEach(d=>d.classList.remove('error'));
        },600);
      }
    },180);
  }
}
function updateCodeDisplay(){
  document.querySelectorAll('.code-digit').forEach((d,i)=>{
    d.textContent = codeState.input[i]||'';
    d.classList.toggle('filled', !!codeState.input[i]);
  });
}

let dialogueQueue = [], dialogueIndex = 0, dialogueTyping = false, dialogueEndCb = null;
function showDialogue(key, onComplete){
  const arr = Dialogues[key];
  if(!arr) return;
  dialogueQueue = arr; dialogueIndex = 0; dialogueEndCb = onComplete||null;
  $('dialogue-box').classList.add('show');
  // 对话进行时，降低左下角环境文字的存在感，避免视觉拥挤
  $('scene-ambience').classList.add('dim');
  typeLine();
}
function typeLine(){
  const line = dialogueQueue[dialogueIndex];
  if(!line){ hideDialogue(); return; }
  // 设置头像与名字
  const av = $('dialogue-avatar');
  av.style.backgroundImage = `url('assets/char_${line.who}.jpg')`;
  const nameEl = $('dialogue-name');
  nameEl.textContent = line.name;
  // 角色名字颜色区分：直实蓝/瑠璃粉/成年直实绿/狐面行者灰
  nameEl.className = 'dialogue-name name-' + (line.who||'nao');
  const txtEl = $('dialogue-text');
  txtEl.innerHTML = '';
  dialogueTyping = true;
  let i=0;
  const full = line.text;
  function tick(){
    if(!dialogueTyping) { txtEl.innerHTML = full + '<span class="cursor"></span>'; return; }
    if(i<full.length){
      txtEl.innerHTML = full.slice(0,i+1) + '<span class="cursor"></span>';
      i++;
      setTimeout(tick, 38);
    } else {
      dialogueTyping = false;
    }
  }
  tick();
}
function advanceDialogue(){
  if(dialogueTyping){
    // 跳过打字
    dialogueTyping = false;
    const line = dialogueQueue[dialogueIndex];
    $('dialogue-text').innerHTML = line.text + '<span class="cursor"></span>';
    return;
  }
  dialogueIndex++;
  if(dialogueIndex >= dialogueQueue.length){
    hideDialogue();
    if(dialogueEndCb){ const cb=dialogueEndCb; dialogueEndCb=null; cb(); }
    // 对话结束后尝试触发结局（处理碎片收集顺序的边界情况）
    tryTriggerEnding();
  } else {
    typeLine();
  }
}
function hideDialogue(){
  $('dialogue-box').classList.remove('show');
  $('scene-ambience').classList.remove('dim');
}
$('dialogue-box').addEventListener('click', advanceDialogue);

function renderSceneHotspots(sceneId){
  const def = SceneDefs[sceneId];
  const sceneEl = $('scene-'+sceneId);
  // 清空旧热点
  let layer = sceneEl.querySelector('.hotspot-layer');
  if(layer) layer.remove();
  layer = document.createElement('div'); layer.className='hotspot-layer';
  sceneEl.appendChild(layer);

  if(sceneId==='classroom'){
    const st = GameState.classroom;
    const solvedMap = { graffiti:st.graffiti, sticky:st.sticky, blackboard:st.codeSolved };
    def.hotspots.forEach(h=>{
      const el = document.createElement('div');
      el.className='hotspot'+(solvedMap[h.id]?' solved':'');
      el.style.left=h.x; el.style.top=h.y;
      el.innerHTML = `<div class="hotspot-ring"></div><div class="hotspot-dot"></div><div class="hotspot-label">${h.label}</div>`;
      el.addEventListener('click',()=>onClassroomHotspot(h.id, el));
      layer.appendChild(el);
    });
  } else if(sceneId==='shrine'){
    const st = GameState.shrine;
    // 灯笼组（5个横排）
    const lanternWrap = document.createElement('div');
    lanternWrap.style.cssText='position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);display:flex;gap:30px;';
    for(let i=0;i<5;i++){
      const l=document.createElement('div');
      l.className='lantern'+(st.lanterns[i]?' lit':''); l.dataset.i=i;
      l.innerHTML=`<div class="lantern-string"></div><div class="lantern-cap"></div><div class="lantern-body"></div>`;
      l.addEventListener('click',()=>onLantern(i));
      lanternWrap.appendChild(l);
    }
    layer.appendChild(lanternWrap);
    // 石碑、画作
    [{id:'tablet',x:'28%',y:'55%',label:'石碑',solved:st.tablet},{id:'painting',x:'70%',y:'50%',label:'瑠璃的画作',solved:st.painting}].forEach(h=>{
      const el=document.createElement('div');
      el.className='hotspot'+(h.solved?' solved':''); el.style.left=h.x; el.style.top=h.y;
      el.innerHTML=`<div class="hotspot-ring"></div><div class="hotspot-dot"></div><div class="hotspot-label">${h.label}</div>`;
      el.addEventListener('click',()=>onShrineHotspot(h.id, el));
      layer.appendChild(el);
    });
  } else if(sceneId==='river'){
    const st = GameState.river;
    const fragSolved = { frag1:st.f1, frag2:st.f2, frag3:st.f3 };
    def.hotspots.forEach(h=>{
      const el=document.createElement('div');
      el.className='hotspot'+(fragSolved[h.id]?' solved':''); el.style.left=h.x; el.style.top=h.y;
      if(h.special==='fragment'){
        el.dataset.frag = h.id;
        el.innerHTML=`<div class="hotspot-ring"></div><div class="hotspot-dot"></div><div class="hotspot-label">${h.label}</div>`;
        if(fragSolved[h.id]){
          // 已收集：禁用点击，并改变颜色
          el.style.pointerEvents='none';
          el.querySelector('.hotspot-dot').style.background='radial-gradient(circle,rgba(120,255,170,0.9),rgba(60,200,120,0.4))';
        } else {
          el.addEventListener('click',(e)=>onFragment(h.id, el, e));
        }
      } else {
        el.innerHTML=`<div class="hotspot-ring"></div><div class="hotspot-dot"></div><div class="hotspot-label">${h.label}</div>`;
        el.addEventListener('click',()=>onWater(el));
      }
      layer.appendChild(el);
    });
  }
  applyRealityToScene(sceneId);
}

function switchScene(sceneId){
  if(!GameState.unlockedScenes.includes(sceneId)){
    showToast('该场景尚未解锁');
    return;
  }
  AudioSys.transition();
  const veil = $('transition-veil');
  veil.classList.add('show');
  setTimeout(()=>{
    GameState.scene = sceneId;
    // 切换场景显示
    document.querySelectorAll('.scene').forEach(s=>s.classList.remove('active'));
    $('scene-'+sceneId).classList.add('active');
    // 渲染热点
    renderSceneHotspots(sceneId);
    // 更新顶部标签
    document.querySelectorAll('.scene-tab').forEach(t=>t.classList.toggle('active', t.dataset.scene===sceneId));
    // 雨
    $('rain-canvas').classList.toggle('active', sceneId==='river');
    veil.classList.remove('show');
    // 引导与氛围：场景名称大字幕、环境文字、浮动提示、怠速检测
    SceneGuide.onEnterScene(sceneId);
    updateHint();
    saveGame();
    // 首次进入场景的登场对话
    if(sceneId==='shrine' && !GameState.flags.shrineEntered){
      GameState.flags.shrineEntered = true;
      setTimeout(()=>showDialogue('shrineEnter'), 700);
    } else if(sceneId==='river' && !GameState.flags.riverEntered){
      GameState.flags.riverEntered = true;
      setTimeout(()=>showDialogue('riverEnter'), 700);
    }
  },420);
}

   ============================================================ */
function toggleReality(){
  if(!GameState.realityUnlocked){
    showToast('虚实切换尚未解锁——先解开教室的谜题');
    return;
  }
  AudioSys.click();
  GameState.reality = (GameState.reality==='normal') ? 'corrupted':'normal';
  applyRealityState();
  // 风铃在崩坏态切换时播放杂音
  if(GameState.reality==='corrupted') AudioSys.glitch();
}
function applyRealityState(){
  const btn = $('reality-toggle');
  btn.classList.toggle('corrupted', GameState.reality==='corrupted');
  applyRealityToScene(GameState.scene);
  // 更新场景色调遮罩
  document.querySelectorAll('.scene').forEach(s=>{
    s.classList.toggle('corrupted', GameState.reality==='corrupted' && s.classList.contains('active'));
  });
}
function applyRealityToScene(sceneId){
  const def = SceneDefs[sceneId];
  const el = $('scene-'+sceneId);
  if(GameState.reality==='corrupted'){
    el.style.backgroundImage = def.bgCorrupted;
    el.classList.add('corrupted');
  } else {
    el.style.backgroundImage = def.bgNormal;
    el.classList.remove('corrupted');
  }
}

function addClue(clue){
  if(GameState.clues.some(c=>c.id===clue.id)) return;
  GameState.clues.push(clue);
  ParticleSys.burstStars(window.innerWidth/2, window.innerHeight*0.5, '#FFD700');
  AudioSys.clue();
  showToast('发现新线索：'+clue.title);
  updateCluePanel();
  saveGame();
}
function addFragment(fragment){
  if(GameState.fragments.some(f=>f.id===fragment.id)) return;
  fragment.collected = true;
  GameState.fragments.push(fragment);
  updateCluePanel();
  updateFragBadge();
  saveGame();
}
function updateFragBadge(){
  const b = $('frag-badge');
  const n = GameState.fragments.length;
  b.textContent = n;
  b.style.display = n>0 ? 'flex':'none';
}
function updateCluePanel(){
  const body = $('panel-body');
  const tab = document.querySelector('.panel-subtab.active').dataset.tab;
  if(tab==='clue'){
    if(GameState.clues.length===0){
      body.innerHTML = '<div class="empty-hint">尚未发现任何线索。<br>探索场景、切换虚实，<br>留意那些「不自然」的细节。</div>';
      return;
    }
    body.innerHTML = GameState.clues.map(c=>`
      <div class="clue-card"><h4>${c.title}</h4><p>${c.text}</p></div>
    `).join('');
  } else {
    const all = [
      {id:'frag1',name:'夏末的约定',desc:'瑠璃关于颠倒天空的许愿。'},
      {id:'frag2',name:'夹缝中的低语',desc:'被封存在两层世界之间的声音。'},
      {id:'frag3',name:'未寄出的画',desc:'她画下的、即将崩塌的世界。'}
    ];
    body.innerHTML = all.map(f=>{
      const got = GameState.fragments.some(x=>x.id===f.id);
      return `<div class="fragment-card ${got?'collected':''}">
        <div class="fragment-icon">${got?'✦':'?'}</div>
        <div class="fragment-info"><h4>${got?f.name:'???'}</h4><p>${got?f.desc:'尚未收集的记忆碎片'}</p></div>
      </div>`;
    }).join('');
  }
}

  function showPrompt(){

    p.classList.add('show');

    promptTimer = setTimeout(()=>p.classList.remove('show'), 3000);
  }
  // 场景名称大字幕（切换时淡入淡出）
  function showSceneName(sceneId){

    $('scene-name-en').textContent = nameEn[sceneId]||'';

    t.classList.add('show');

  function setAmbience(sceneId){
    const a = $('scene-ambience');

})();

const SAVE_KEY = 'reversed_world_save_v1';
function saveGame(){
  try{
    const data = {
      scene:GameState.scene, reality:GameState.reality, realityUnlocked:GameState.realityUnlocked,
      clues:GameState.clues, fragments:GameState.fragments, flags:GameState.flags,
      classroom:GameState.classroom, shrine:GameState.shrine, river:GameState.river,
      unlockedScenes:GameState.unlockedScenes, started:GameState.started
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  }catch(e){}
}
function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const data = JSON.parse(raw);
    Object.assign(GameState, data);
    return true;
  }catch(e){ return false; }
}
function hasSave(){
  try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; }
}

function checkClassroomComplete(){

  GameState.flags.classroomComplete = true;

const RainSys = (() => {
  const canvas = $('rain-canvas');
  const ctx = canvas.getContext('2d');
  let drops=[], W=0,H=0, raf=null;
  function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
  window.addEventListener('resize', resize); resize();
  function init(){
    drops=[];
    for(let i=0;i<80;i++){
      drops.push({x:Math.random()*W, y:Math.random()*H, len:14+Math.random()*22, speed:7+Math.random()*9, alpha:0.3+Math.random()*0.5});
    }
  }
  function loop(){
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='rgba(160,210,255,0.6)';
    ctx.lineWidth=1.2;
    drops.forEach(d=>{
      ctx.globalAlpha=d.alpha;
      ctx.beginPath(); ctx.moveTo(d.x,d.y); ctx.lineTo(d.x-2, d.y+d.len); ctx.stroke();
      d.y+=d.speed; d.x-=0.4;
      if(d.y>H){ d.y=-d.len; d.x=Math.random()*W; }
    });
    ctx.globalAlpha=1;
    raf=requestAnimationFrame(loop);
  }
  function start(){ if(raf) return; init(); loop(); }
  function stop(){ if(raf){ cancelAnimationFrame(raf); raf=null; } }
  return {start,stop,resize};
})();

  ParticleSys.collectFly(rect.left+rect.width/2, rect.top+rect.height/2);
  ParticleSys.burstStars(rect.left+rect.width/2, rect.top+rect.height/2, '#FFB7C5');

  let frag, dialogueKey=null, afterCb=null;
  if(fragId==='frag1'){
    GameState.river.f1 = true;
    frag = {id:'frag1',name:'夏末的约定',desc:'瑠璃关于颠倒天空的许愿，封存在第一枚碎片中。'};

  } else if(fragId==='frag2'){

    frag = {id:'frag2',name:'夹缝中的低语',desc:'被封存在两层世界之间的声音碎片。'};
    addFragment(frag);
    addClue({id:'clue_frag2',title:'记忆碎片·二',text:'「我没有离开，只是去了一个你看不见的层。」——瑠璃被困于虚像层的真相。'});
    // 第二枚触发世界异常
    if(!GameState.river.glitchTriggered){
      GameState.river.glitchTriggered = true;
      dialogueKey='ruriMemory';
      afterCb = ()=>{
        triggerWorldGlitch(()=>{
          showDialogue('worldGlitch');
        });

  } else if(fragId==='frag3'){
    GameState.river.f3 = true;
    frag = {id:'frag3',name:'未寄出的画',desc:'她画下的、即将崩塌的世界，与神社那幅画互为镜像。'};

  el.style.pointerEvents='none';
  el.querySelector('.hotspot-dot').style.background='radial-gradient(circle,rgba(120,255,170,0.9),rgba(60,200,120,0.4))';

function tryTriggerEnding(){
  if(GameState.river.ended) return;
  if(!(GameState.river.f1 && GameState.river.f2 && GameState.river.f3)) return;
  // 对话或弹窗进行中则等待，由 advanceDialogue 完成后再次判定
  if($('dialogue-box').classList.contains('show')) return;
  if(document.querySelector('.modal-mask.show')) return;
  if($('glitch-overlay').classList.contains('active')) return;
  GameState.river.ended = true;
  setTimeout(()=>{
    showDialogue('allFragmentsCollected', ()=>{
      showDialogue('endingDialogue', ()=>{ triggerEnding(); });
    });
  }, 600);
}

function triggerWorldGlitch(onDone){
  AudioSys.glitch();

        <li><b>虚实切换：</b>在常态与崩坏态之间切换视角，同一场景会显现截然不同的线索与文字。崩坏态下，日记、课本、画作都会吐露隐藏的真相，水面也会浮现被封存的呼喊。这是读懂世界背面的钥匙，但切换并非毫无代价——每多看一层，现实就更不稳一分。</li>
        <li><b>镜像解谜：</b>虚像层的文字左右颠倒，需在心中将其翻转才能读懂暗号。课桌涂鸦「εCL」翻转后即为「739」，是贯穿全篇的核心密码。镜面不仅是谜题的手法，更是这个世界最本质的隐喻——你所见的，未必是它的本来面目。</li>
        <li><b>碎片收集：</b>在河畔场景收集散落的记忆碎片。每枚碎片都封存着瑠璃的一段意识，也封存着这个世界的一段真相。集齐后将触发世界异常与序章结局——三枚碎片合一，方能在因果层留下不可擦除的印记。</li>
        <li><b>怠速引导：</b>若你长时间未交互，热点的脉冲会自动加速，提示你还有未调查的角落。屏幕左下角的环境文字，也会随场景流转，悄悄补充氛围与伏笔。</li>
      </ul>
    </div>
    <div class="modal-divider"></div>
    <div class="lore-section">
      <h3>主题内核</h3>
      <p><b>记忆的真伪：</b>当一段记忆可以被因果层反复擦写，我们该如何判断它是否真实？序章给出的答案是——真正重要的，从来不是记忆是否「准确」，而是是否有人愿意替你记得。直实之所以是锚点，正因为他「记得」这件本该被抹除的事。</p>
      <p><b>救赎的本质：</b>瑠璃主动踏入虚像层，是为了替直实拦下崩塌；直实穿越虚实，是为了把瑠璃带回来。救赎从来不是单方向的拯救，而是两个人在不同层里，朝彼此伸出手。哪怕这一次只能换来一句告别，那也是不可擦除的重逢。</p>
      <p><b>颠倒与重启：</b>「颠倒」既是世界的物理状态，也是视角的隐喻：换一面看，才会看见被遮蔽的真相。「重启」则不是抹除过去重来，而是带着所有发生过的事，重新出发——这才是序章真正想交给你的，通往第一章的钥匙。</p>
    </div>
    <div class="modal-divider"></div>
    <div class="lore-section">
      <h3>核心密码 · 739</h3>
      <p>739 不是随机的数字。它是瑠璃在崩坏前亲手刻下的坐标，是连接现实层与虚像层的钥匙，也是囚禁她的囚笼。涂鸦暗号、便利贴、黑板锁、石碑镜像——处处都指向它。当你读懂这个数字，便读懂了整个颠倒世界的入口。</p>
    </div>`;
  $('lore-body').innerHTML = html;
}

function buildControls(){
  const html = `
    <div class="lore-section">
      <h3>基础操作</h3>
      <ul class="mech-list">
        <li><b>场景切换：</b>点击顶部导航栏的「教室 / 鸟居 / 河畔」标签，在不同场景间移动。新场景需解锁后才能进入。每次切换时，屏幕中央会浮现场景名称大字幕，左下角会出现该场景的环境文字。</li>
        <li><b>调查物品：</b>场景中带有发光圆点的位置为可交互点，圆点下方有始终可见的物品名称标签，点击即可调查，弹出物品详情。若你长时间未操作，热点的脉冲会自动加速，提示你还有未调查的角落。</li>
        <li><b>虚实切换：</b>点击屏幕左侧的圆形「虚实」按钮，在常态与崩坏态之间切换。崩坏态下，世界会显现隐藏的线索与文字。该功能需在教室解开谜题后解锁。</li>
        <li><b>输入密码：</b>点击黑板、石碑等需要密码的物品时，会弹出数字键盘。依次点击数字输入，⌫ 为删除，清 为清空。输错时会有摇晃反馈，首次输错还会触发角色的疑惑对话。</li>
        <li><b>推进对话：</b>对话框出现时，点击对话框任意位置可逐句推进；打字过程中点击可跳过当前打字效果。对话角色名字会以不同颜色区分（直实蓝、瑠璃粉、成年直实绿、狐面行者灰）。</li>
      </ul>
    </div>
    <div class="modal-divider"></div>
    <div class="lore-section">
      <h3>界面功能</h3>
      <ul class="mech-list">
        <li><b>线索面板：</b>点击右上角「线索」按钮打开右侧抽屉，查看已发现的线索与记忆碎片图鉴。可在「线索 / 碎片」两个标签间切换。</li>
        <li><b>提示系统：</b>点击右下角金色「提示」按钮，分 3 级逐步给出当前场景的解谜提示。提示内容会随场景动态变化，从含蓄暗示到直接答案。</li>
        <li><b>存档 / 读档：</b>点击「存档」按钮手动保存进度（也会在切换场景、发现线索时自动保存）。在标题界面点击「继续游戏」可读取存档。</li>
        <li><b>返回标题：</b>点击「返回」按钮回到开始界面，进度会自动保存。</li>
      </ul>
    </div>
    <div class="modal-divider"></div>
    <div class="lore-section">
      <h3>通关流程</h3>
      <ul class="mech-list">
        <li><b>第一章 · 教室：</b>调查涂鸦「εCL」与便利贴「7-3-9」，在黑板输入密码 739，解锁虚实切换并触发成年直实登场。再切换至崩坏态调查日记、课本，发现隐藏线索。</li>
        <li><b>第二章 · 鸟居：</b>点亮第 1、3、5 盏灯笼（奇者为正）；调查石碑输入密码 739，揭示瑠璃的画作，解锁河畔。</li>
        <li><b>第三章 · 河畔：</b>在崩坏态下点击水面发现隐藏文字；逐一收集 3 枚记忆碎片。第二枚会引发世界异常，全部集齐触发序章结局。</li>
      </ul>
    </div>`;
  $('controls-body').innerHTML = html;
}

function startGame(){
  AudioSys.ensure();
  AudioSys.transition();
  GameState.reset();
  GameState.started = true;
  ParticleSys.setMode('game');
  $('title-screen').classList.add('hidden');
  setTimeout(()=>{
    $('game-screen').classList.add('active');
    renderSceneHotspots('classroom');
    SceneGuide.onEnterScene('classroom'); // 首章引导：场景名/环境文字/提示
    updateCluePanel();
    updateFragBadge();
    updateHint();
    showToast('第一章 · 北宇治高中教室');
    saveGame();
  }, 800);
}

function continueGame(){
  if(!hasSave()){ showToast('没有可读取的存档'); return; }
  AudioSys.ensure();
  loadGame();
  AudioSys.transition();
  ParticleSys.setMode('game');
  $('title-screen').classList.add('hidden');
  setTimeout(()=>{
    $('game-screen').classList.add('active');
    // 恢复 UI
    document.querySelectorAll('.scene-tab').forEach(t=>{
      t.classList.remove('locked');
      if(!GameState.unlockedScenes.includes(t.dataset.scene)) t.classList.add('locked');
    });
    $('reality-toggle').classList.toggle('disabled', !GameState.realityUnlocked);
    switchScene(GameState.scene);
    updateCluePanel();
    updateFragBadge();
    showToast('已读取存档');
  }, 800);
}

/* ============================================================
   十五、事件绑定与启动
   ============================================================ */
function bindEvents(){
  // 标题按钮
  $('btn-start').addEventListener('click', ()=>{ AudioSys.click(); startGame(); });
  $('btn-continue').addEventListener('click', ()=>{ AudioSys.click(); continueGame(); });
  $('btn-lore').addEventListener('click', ()=>{ AudioSys.click(); buildLore(); openModal('lore-modal'); });
  $('btn-controls').addEventListener('click', ()=>{ AudioSys.click(); buildControls(); openModal('controls-modal'); });

  // 按钮光晕跟随鼠标
  document.querySelectorAll('.tbtn').forEach(b=>{
    b.addEventListener('mousemove',e=>{
      const r=b.getBoundingClientRect();
      b.style.setProperty('--mx',(e.clientX-r.left)+'px');
      b.style.setProperty('--my',(e.clientY-r.top)+'px');
    });
  });

  // 顶部导航
  document.querySelectorAll('.scene-tab').forEach(t=>{
    t.addEventListener('click',()=>{ if(t.classList.contains('locked')){ showToast('该场景尚未解锁'); return;} AudioSys.click(); switchScene(t.dataset.scene); });
  });
  $('nav-clue').addEventListener('click',()=>{ AudioSys.click(); $('clue-panel').classList.add('open'); updateCluePanel(); });
  $('nav-frag').addEventListener('click',()=>{ AudioSys.click(); $('clue-panel').classList.add('open'); document.querySelector('.panel-subtab[data-tab="frag"]').click(); });
  $('nav-save').addEventListener('click',()=>{ AudioSys.click(); saveGame(); showSaveTag(); });
  $('nav-menu').addEventListener('click',()=>{ AudioSys.click(); saveGame(); $('game-screen').classList.remove('active'); setTimeout(()=>{ $('title-screen').classList.remove('hidden'); ParticleSys.setMode('title'); },300); });

  $('panel-close').addEventListener('click',()=>{ AudioSys.click(); $('clue-panel').classList.remove('open'); });
  document.querySelectorAll('.panel-subtab').forEach(s=>{
    s.addEventListener('click',()=>{ AudioSys.click(); document.querySelectorAll('.panel-subtab').forEach(x=>x.classList.remove('active')); s.classList.add('active'); updateCluePanel(); });
  });

  // 虚实切换
  $('reality-toggle').addEventListener('click', toggleReality);

  // 提示
  $('hint-btn').addEventListener('click', showHint);

  // 结局重启
  $('ending-restart').addEventListener('click',()=>{ AudioSys.click(); $('ending-screen').classList.remove('show'); setTimeout(()=>{ GameState.reset(); location.reload(); }, 600); });

  // 暴露教室完成检测：在每次热点交互后检查；同时重置怠速计时
  document.addEventListener('click',()=>{ SceneGuide.resetIdle(); setTimeout(checkClassroomComplete, 200); });

  // 首次用户交互后激活音频上下文
  document.body.addEventListener('pointerdown', ()=>AudioSys.ensure(), {once:true});
}

// 启动
window.addEventListener('DOMContentLoaded', ()=>{
  ParticleSys.setMode('title');
  buildLore();
  buildControls();
  bindEvents();
  RainSys.start(); // 预启动雨循环（画布默认透明）
});

// 监听崩坏态下进入河畔自动开启雨（已在 switchScene 处理）
</script>
</body>
</html>
